<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Huecos · Citas de peluquería y estética de última hora</title>
  <meta name="description" content="Alguien acaba de cancelar su cita. Aprovecha huecos de última hora en peluquerías y salones de tu barrio con descuentos directos.">

  <!-- Tipografías: Plus Jakarta Sans (interfaz moderna y cercana) + Fraunces (acentos editoriales) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. TOKENS DE DISEÑO (ESTÉTICA MELOCOTÓN CÁLIDO + CORAL VIBRANTE #F4743B)
       ========================================================================== */
    :root {
      --bg-outer: #F3E5DC;
      --peach-top: #FBF3EE;
      --peach-bottom: #F7EAE2;
      --peach-blob: rgba(244, 116, 59, 0.085);
      --card: #FFFFFF;
      --card-soft: #FFF9F5;
      --coral: #F4743B;
      --coral-dark: #E05C22;
      --coral-soft: rgba(244, 116, 59, 0.12);
      --ink: #1F1B18;
      --ink-soft: #5C534C;
      --mute: #9A8F87;
      --line: rgba(31, 27, 24, 0.08);
      --sage: #278056;
      --sage-soft: rgba(39, 128, 86, 0.12);
      --gold: #F5A623;
      --shadow-card: 0 12px 30px rgba(178, 108, 74, 0.10);
      --shadow-elevated: 0 18px 38px rgba(244, 116, 59, 0.18);
      --shadow-shell: 0 28px 70px rgba(135, 78, 49, 0.18);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg-outer);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }

    /* Centrado tipo marco móvil elegante en escritorio */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 880px;
      background: linear-gradient(180deg, var(--peach-top) 0%, var(--peach-bottom) 100%);
      border-radius: 36px;
      box-shadow: var(--shadow-shell), 0 0 0 8px rgba(255, 255, 255, 0.55);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Ondas orgánicas de fondo melocotón como en la referencia */
    .app-shell::before {
      content: "";
      position: absolute;
      top: -90px;
      right: -70px;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 116, 59, 0.11) 0%, rgba(244, 116, 59, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app-shell::after {
      content: "";
      position: absolute;
      bottom: 80px;
      left: -90px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 116, 59, 0.08) 0%, rgba(244, 116, 59, 0) 72%);
      pointer-events: none;
      z-index: 0;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        background: var(--peach-top);
      }
      .app-shell {
        max-width: 100%;
        max-height: 100dvh;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    .scroll-area {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: calc(16px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
      scrollbar-width: none;
    }

    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    .scroll-area.with-sticky-cta {
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }

    button, input, select {
      font: inherit;
      color: inherit;
      border: none;
      background: none;
    }

    button {
      cursor: pointer;
      transition: transform 0.18s var(--ease-out), background-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--coral);
      outline-offset: 2px;
    }

    .serif {
      font-family: 'Fraunces', Georgia, serif;
      letter-spacing: -0.02em;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       2. CABECERA SUPERIOR (HAMBURGUESA CORAL + BOLSA CON BADGE + AVATAR)
       ========================================================================== */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      min-height: 42px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 12px rgba(178, 108, 74, 0.08);
      position: relative;
    }

    .icon-btn:hover {
      background: #FFFFFF;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-count {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--coral);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(244, 116, 59, 0.45);
    }

    .avatar-pill {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: linear-gradient(135deg, #FF9B6A 0%, var(--coral) 100%);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(244, 116, 59, 0.28);
      border: 2px solid #FFFFFF;
    }

    /* ==========================================================================
       3. TÍTULO HERO EN DOS LÍNEAS Y BARRA DE BÚSQUEDA
       ========================================================================== */
    .hero-title {
      font-size: 27px;
      line-height: 1.18;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 18px;
    }

    .hero-title strong {
      display: block;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border-radius: 18px;
      padding: 6px 8px 6px 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 22px;
    }

    .search-bar input {
      flex: 1;
      font-size: 14px;
      color: var(--ink);
      min-width: 0;
      padding: 8px 0;
    }

    .search-bar input::placeholder {
      color: var(--mute);
    }

    .filter-trigger {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: var(--card-soft);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .filter-trigger.has-filters {
      background: var(--coral);
      color: #FFFFFF;
    }

    /* ==========================================================================
       4. SECCIÓN CATEGORÍAS (CARRUSEL HORIZONTAL CUADRADO REDONDEADO)
       ========================================================================== */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-sub {
      font-size: 12px;
      color: var(--coral);
      font-weight: 600;
    }

    .cat-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin: 0 -20px 20px;
      padding-left: 20px;
      padding-right: 20px;
      scrollbar-width: none;
    }

    .cat-row::-webkit-scrollbar {
      display: none;
    }

    .cat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      width: 66px;
    }

    .cat-box {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(178, 108, 74, 0.08);
      color: var(--coral);
      transition: all 0.22s var(--ease-out);
    }

    .cat-item.active .cat-box {
      background: var(--coral);
      color: #FFFFFF;
      box-shadow: 0 10px 22px rgba(244, 116, 59, 0.35);
      transform: translateY(-2px);
    }

    .cat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-soft);
      text-align: center;
    }

    .cat-item.active .cat-label {
      color: var(--coral-dark);
      font-weight: 700;
    }

    /* ==========================================================================
       5. CARRUSEL DESTACADO DE HUECOS (CON TARJETA CENTRAL ELEVADA)
       ========================================================================== */
    .featured-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 12px 20px 22px;
      margin: 0 -20px 8px;
      scrollbar-width: none;
      align-items: center;
    }

    .featured-row::-webkit-scrollbar {
      display: none;
    }

    .slot-card {
      scroll-snap-align: center;
      flex-shrink: 0;
      width: 196px;
      background: var(--card);
      border-radius: 26px;
      padding: 14px;
      box-shadow: var(--shadow-card);
      position: relative;
      transition: transform 0.28s var(--ease-out), box-shadow 0.28s var(--ease-out);
      cursor: pointer;
    }

    .slot-card.elevated {
      width: 214px;
      padding: 16px;
      transform: translateY(-6px);
      box-shadow: var(--shadow-elevated);
      border: 1.5px solid rgba(244, 116, 59, 0.22);
    }

    .slot-top-badges {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .disc-pill {
      background: var(--coral);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 999px;
    }

    .time-pill {
      background: var(--coral-soft);
      color: var(--coral-dark);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .slot-visual {
      height: 92px;
      border-radius: 20px;
      background: linear-gradient(145deg, #FFF5EE 0%, #FDE7D9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      position: relative;
    }

    .slot-card.elevated .slot-visual {
      height: 106px;
    }

    .slot-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.25;
      margin-bottom: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .slot-salon {
      font-size: 11.5px;
      color: var(--mute);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slot-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 10px;
    }

    .slot-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .price-group {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .price-now {
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
    }

    .price-old {
      font-size: 12px;
      color: var(--mute);
      text-decoration: line-through;
    }

    .mini-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--card-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--mute);
    }

    .mini-icon-btn.fav-on {
      color: #E53935;
      background: rgba(229, 57, 53, 0.1);
    }

    .mini-icon-btn.book-quick {
      background: var(--coral);
      color: #FFFFFF;
    }

    /* ==========================================================================
       6. SECCIÓN MEJORES OFERTAS DE HOY (TARJETAS COMPACTAS)
       ========================================================================== */
    .deals-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 4px 20px 14px;
      margin: 0 -20px;
      scrollbar-width: none;
    }

    .deals-row::-webkit-scrollbar {
      display: none;
    }

    .deal-card {
      flex-shrink: 0;
      width: 142px;
      background: var(--card);
      border-radius: 22px;
      padding: 12px;
      box-shadow: 0 8px 22px rgba(178, 108, 74, 0.08);
      cursor: pointer;
      position: relative;
    }

    .deal-visual {
      height: 66px;
      border-radius: 15px;
      background: #FFF6F0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 9px;
      position: relative;
    }

    .deal-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: var(--coral);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .deal-title {
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .deal-meta {
      font-size: 11px;
      color: var(--mute);
      margin-bottom: 7px;
    }

    /* ==========================================================================
       7. PANTALLA DE DETALLE DEL HUECO (ESTILO PANTALLA DERECHA DE REFERENCIA)
       ========================================================================== */
    .detail-viewer {
      background: var(--card);
      border-radius: 30px;
      padding: 18px;
      box-shadow: var(--shadow-card);
      margin-bottom: 20px;
      position: relative;
    }

    .slide-stage {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 8px 24px;
    }

    .slide-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--card-soft);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
    }

    .slide-arrow.prev { left: 0; }
    .slide-arrow.next { right: 0; }

    .dots-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(31, 27, 24, 0.16);
      transition: all 0.22s ease;
    }

    .dot.active {
      width: 20px;
      background: var(--coral);
    }

    .detail-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 6px;
    }

    .detail-title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .detail-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .controls-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 18px 0 20px;
      flex-wrap: wrap;
    }

    .qty-stepper {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      padding: 5px 8px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(178, 108, 74, 0.08);
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 9px;
      background: var(--coral);
      color: #FFFFFF;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .info-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--card);
      padding: 8px 11px;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      box-shadow: 0 4px 14px rgba(178, 108, 74, 0.07);
    }

    .detail-big-price {
      font-size: 26px;
      font-weight: 800;
      color: var(--ink);
    }

    .sticky-cta-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(247, 234, 226, 0) 0%, var(--peach-bottom) 32%);
      z-index: 15;
    }

    /* ==========================================================================
       8. BOTONES PÍLDORA Y FORMULARIOS LIMPIOS
       ========================================================================== */
    .btn-pill {
      width: 100%;
      background: var(--coral);
      color: #FFFFFF;
      padding: 16px 24px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 12px 26px rgba(244, 116, 59, 0.36);
    }

    .btn-pill:hover {
      background: var(--coral-dark);
    }

    .btn-pill.secondary {
      background: var(--card);
      color: var(--ink);
      box-shadow: var(--shadow-card);
    }

    .btn-pill.apple {
      background: #181615;
      color: #FFFFFF;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
    }

    .input-card {
      background: var(--card);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }

    .field input, .field select {
      width: 100%;
      background: var(--card-soft);
      border: 1.5px solid rgba(31, 27, 24, 0.08);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14.5px;
      color: var(--ink);
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .field input:focus, .field select:focus {
      border-color: var(--coral);
      background: #FFFFFF;
      outline: none;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ==========================================================================
       9. MENÚ LATERAL DESLIZABLE (DRAWER) Y MODALES
       ========================================================================== */
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(31, 27, 24, 0.38);
      backdrop-filter: blur(3px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 82%;
      max-width: 310px;
      background: linear-gradient(180deg, #FFFBF8 0%, var(--peach-bottom) 100%);
      border-radius: 0 30px 30px 0;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      z-index: 50;
      transform: translateX(-105%);
      transition: transform 0.3s var(--ease-out);
      display: flex;
      flex-direction: column;
      box-shadow: 16px 0 40px rgba(31, 27, 24, 0.14);
    }

    .drawer-panel.open {
      transform: translateX(0);
    }

    .drawer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 13px 14px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .drawer-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .drawer-item.active {
      background: var(--coral);
      color: #FFFFFF;
      box-shadow: 0 8px 18px rgba(244, 116, 59, 0.28);
    }

    .drawer-item:not(.active):hover {
      background: rgba(255, 255, 255, 0.75);
    }

    /* Bottom Sheet para Filtros */
    .sheet-panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: #FFFFFF;
      border-radius: 30px 30px 0 0;
      padding: 22px 22px calc(26px + env(safe-area-inset-bottom));
      z-index: 50;
      transform: translateY(105%);

      white-space: nowrap;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;

      opacity: 1;

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }

    function loadData() {

        if (!raw) return getDefaultData();
        const parsed = JSON.parse(raw);
        if (!parsed.users || !Array.isArray(parsed.slots)) return getDefaultData();
        return parsed;
      } catch (e) {
        return getDefaultData();
      }

    function getFilteredLiveSlots() {
      const now = Date.now();
      const q = STATE.searchQuery.trim().toLowerCase();

      let list = DB.slots.filter(s => s.st === 'live' && s.spotsLeft > 0 && s.t > now);

      if (STATE.selectedCat !== 'Todo') {
        list = list.filter(s => s.cat === STATE.selectedCat);
      }

      if (STATE.maxWalk < 99) {
        list = list.filter(s => (s.walkMins || 10) <= STATE.maxWalk);
      }

      if (q) {
        list = list.filter(s =>
          s.s.toLowerCase().includes(q) ||
          s.biz.toLowerCase().includes(q) ||
          (s.address || '').toLowerCase().includes(q) ||
          s.cat.toLowerCase().includes(q)
        );
      }

      if (STATE.sortBy === 'discount') {
        list.sort((a, b) => b.disc - a.disc);
      } else if (STATE.sortBy === 'rating') {
        list.sort((a, b) => b.rating - a.rating);
      } else {
        list.sort((a, b) => a.t - b.t);
      }

      return list;
    }

    function getUserBookings() {
      if (!STATE.user) return [];
      const res = [];
      DB.slots.forEach(s => {
        (s.bookings || []).forEach((b, idx) => {
          if (b.cliId === STATE.user) {
            res.push({ slot: s, booking: b, idx });
          }
        });
      });
      return res.sort((a, b) => a.slot.t - b.slot.t);
    }

    function isFavorite(slotId) {
      if (!STATE.user || STATE.role !== 'cli') return false;
      const favs = DB.users[STATE.user].favorites || [];
      return favs.includes(slotId);

    /* ==========================================================================

      const initials = u.name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const bookingsCount = getUserBookings().length;

      return `
        <header class="topbar">
          <button type="button" class="icon-btn" onclick="toggleDrawer(true)" aria-label="Abrir menú lateral">
            ${ICONS.menu}
          </button>
          <div class="topbar-right">
            <button type="button" class="icon-btn" onclick="navTo('bookings')" aria-label="Mis citas y bolsa">
              ${ICONS.bag}
              ${bookingsCount > 0 ? `<span class="badge-count">${bookingsCount}</span>` : ''}

            <button type="button" class="avatar-pill" onclick="toggleDrawer(true)" aria-label="Perfil de ${esc(u.name)}">
              ${esc(initials)}
            </button>
          </div>

            <div class="avatar-pill" style="width:46px; height:46px; font-size:16px;">
              ${esc(u.name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase())}

          <nav style="flex:1;">
            ${isBiz ? `
              <button type="button" class="drawer-item ${STATE.view === 'biz_dash' ? 'active' : ''}" onclick="drawerNav('biz_dash')">
                <span class="drawer-item-left">${ICONS.clock} Mi Agenda de Hoy</span>
              </button>
              <button type="button" class="drawer-item ${STATE.view === 'biz_new' ? 'active' : ''}" onclick="drawerNav('biz_new')">
                <span class="drawer-item-left">${ICONS.plus} Publicar Hueco</span>
              </button>
              <button type="button" class="drawer-item ${STATE.view === 'biz_settings' ? 'active' : ''}" onclick="drawerNav('biz_settings')">
                <span class="drawer-item-left">${ICONS.pin} Perfil del Salón</span>
              </button>
            ` : `
              <button type="button" class="drawer-item ${STATE.view === 'home' ? 'active' : ''}" onclick="drawerNav('home')">
                <span class="drawer-item-left">${CAT_ICONS.Todo.replace('26', '18').replace('26', '18')} Explorar huecos</span>
              </button>
              <button type="button" class="drawer-item ${STATE.view === 'bookings' ? 'active' : ''}" onclick="drawerNav('bookings')">
                <span class="drawer-item-left">${ICONS.bag} Mis citas y bolsa</span>
                ${bookingsCount > 0 ? `<span style="background:${STATE.view === 'bookings' ? '#fff' : 'var(--coral)'}; color:${STATE.view === 'bookings' ? 'var(--coral)' : '#fff'}; font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px;">${bookingsCount}</span>` : ''}
              </button>
              <button type="button" class="drawer-item ${STATE.view === 'favorites' ? 'active' : ''}" onclick="drawerNav('favorites')">
                <span class="drawer-item-left">${ICONS.heart(false)} Favoritos guardados</span>
                ${favCount > 0 ? `<span style="font-size:11px; font-weight:700; opacity:0.8;">${favCount}</span>` : ''}
              </button>
              <button type="button" class="drawer-item ${STATE.view === 'radar' ? 'active' : ''}" onclick="drawerNav('radar')">
                <span class="drawer-item-left">${ICONS.radar} Radar WhatsApp</span>
              </button>
              <button type="button" class="drawer-item ${STATE.view === 'how' ? 'active' : ''}" onclick="drawerNav('how')">
                <span class="drawer-item-left">${ICONS.help} Cómo funciona</span>
              </button>
            `}

          <div style="padding-top:14px; border-top:1px solid var(--line);">
            <button type="button" class="drawer-item" onclick="resetDemo()" style="font-size:13px; color:var(--ink-soft);">
              <span class="drawer-item-left">${ICONS.clock} Restaurar datos demo</span>
            </button>
            <button type="button" class="drawer-item" onclick="logout()" style="color:#D32F2F;">
              <span class="drawer-item-left">${ICONS.logout} Cerrar sesión</span>

    /* ==========================================================================
       3. VISTA PRINCIPAL DEL CONSUMIDOR (HOME INSPIRADO EN APP DE DELIVERY)
       ========================================================================== */
    function viewConsumerHome() {
      const liveSlots = getFilteredLiveSlots();
      const categories = ['Todo', 'Corte', 'Color', 'Barba', 'Uñas', 'Tratamientos'];
      const hasActiveFilters = STATE.sortBy !== 'soon' || STATE.maxWalk < 99;

      // Asegura índice válido para la tarjeta destacada
      if (STATE.featuredIndex >= liveSlots.length) STATE.featuredIndex = 0;

      // Mejores ofertas del día ordenadas por mayor descuento
      const bestDeals = [...DB.slots]
        .filter(s => s.st === 'live' && s.spotsLeft > 0 && s.t > Date.now())
        .sort((a, b) => b.disc - a.disc);

      return `
        <div class="scroll-area fade-in" id="home-scroll">
          ${renderConsumerTopbar()}

          <h1 class="hero-title">
            Aprovecha los
            <strong>Huecos de hoy</strong>
          </h1>

          <!-- Barra de búsqueda en tiempo real + botón de filtros -->
          <div class="search-bar">
            ${ICONS.search}
            <input
              type="search"
              id="search-input"
              value="${esc(STATE.searchQuery)}"
              placeholder="Buscar corte, color, salón o barrio..."
              oninput="handleSearchInput(this.value)"
              aria-label="Buscar servicio, salón o barrio"
            >
            ${STATE.searchQuery ? `
              <button type="button" onclick="handleSearchInput('')" style="padding:4px 6px; color:var(--mute); font-weight:700;" aria-label="Limpiar búsqueda">×</button>
            ` : ''}
            <button type="button" class="filter-trigger ${hasActiveFilters ? 'has-filters' : ''}" onclick="toggleFilterSheet(true)" aria-label="Ordenar y filtrar">
              ${ICONS.sliders}
            </button>
          </div>

          <!-- Categorías -->
          <div class="section-head">
            <h2 class="section-title">Categorías</h2>
            <span class="section-sub">${liveSlots.length} disponibles</span>
          </div>

          <div class="cat-row" role="tablist" aria-label="Categorías de servicios">
            ${categories.map(cat => `
              <button
                type="button"
                role="tab"
                aria-selected="${STATE.selectedCat === cat}"
                class="cat-item ${STATE.selectedCat === cat ? 'active' : ''}"
                onclick="selectCategory('${cat}')"
              >
                <div class="cat-box">${CAT_ICONS[cat]}</div>
                <span class="cat-label">${cat}</span>
              </button>
            `).join('')}
          </div>

          <!-- Carrusel destacado de Huecos (con tarjeta activa elevada) -->
          ${liveSlots.length ? `
            <div class="featured-row" id="featured-carousel" onscroll="handleCarouselScroll(this)">
              ${liveSlots.map((s, idx) => {
                const isElevated = idx === STATE.featuredIndex;
                const fav = isFavorite(s.id);
                return `
                  <article
                    class="slot-card ${isElevated ? 'elevated' : ''}"
                    onclick="openSlotDetail(${s.id})"
                  >
                    <div class="slot-top-badges">
                      <span class="disc-pill">−${esc(s.disc)}%</span>
                      <span class="time-pill">En ${minsUntil(s.t)} min</span>
                    </div>

                    <div class="slot-visual">
                      ${renderServiceArt(s.cat, isElevated ? 66 : 56)}
                    </div>

                    <h3 class="slot-name">${esc(s.s)}</h3>
                    <p class="slot-salon">${esc(s.biz)} · A ${esc(s.walkMins)} min</p>

                    <div class="slot-rating">
                      ${ICONS.star}
                      <span>${esc(s.rating)}</span>
                      <span style="color:var(--mute); font-weight:500;">(${esc(s.reviewsCount)})</span>
                    </div>

                    <div class="slot-bottom">
                      <div class="price-group tabular">
                        <span class="price-now">${eur(finalPrice(s))}</span>
                        <span class="price-old">${eur(s.p)}</span>
                      </div>
                      <div class="mini-actions">
                        <button
                          type="button"
                          class="mini-icon-btn ${fav ? 'fav-on' : ''}"
                          onclick="event.stopPropagation(); toggleFavorite(${s.id})"
                          aria-label="Guardar en favoritos"
                        >
                          ${ICONS.heart(fav)}
                        </button>
                        <button
                          type="button"
                          class="mini-icon-btn book-quick"
                          onclick="event.stopPropagation(); quickBookFromCard(${s.id})"
                          aria-label="Bloquear este hueco"
                        >
                          ${ICONS.plus}
                        </button>
                      </div>
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
          ` : `
            <div class="input-card" style="text-align:center; padding:32px 20px;">
              <p style="font-weight:700; font-size:16px; margin-bottom:6px;">No hay huecos con ese filtro</p>
              <p style="font-size:13px; color:var(--mute); margin-bottom:16px;">Prueba otra categoría o amplía la distancia a pie.</p>
              <button type="button" class="btn-pill" style="padding:12px 20px; font-size:13px;" onclick="resetFilters()">Ver todos los huecos</button>
            </div>
          `}

          <!-- Sección: Mejores ofertas de hoy -->
          <div class="section-head" style="margin-top:8px;">
            <h2 class="section-title">Mejores ofertas de hoy</h2>
            <span class="section-sub">Hasta −40%</span>
          </div>

          <div class="deals-row">
            ${bestDeals.map(s => `
              <article class="deal-card" onclick="openSlotDetail(${s.id})">
                <div class="deal-visual">
                  <span class="deal-badge">−${esc(s.disc)}%</span>
                  ${renderServiceArt(s.cat, 44)}
                </div>
                <h3 class="deal-title">${esc(s.s)}</h3>
                <p class="deal-meta">${esc(formatHour(s.t))} · A ${esc(s.walkMins)}m</p>
                <div class="price-group tabular">
                  <span class="price-now" style="font-size:15px;">${eur(finalPrice(s))}</span>
                  <span class="price-old" style="font-size:11px;">${eur(s.p)}</span>
                </div>
              </article>
            `).join('')}
          </div>
        </div>

        <!-- Bottom Sheet de Ordenación y Distancia -->
        <div class="drawer-backdrop ${STATE.filterOpen ? 'open' : ''}" onclick="toggleFilterSheet(false)"></div>
        <div class="sheet-panel ${STATE.filterOpen ? 'open' : ''}" role="dialog" aria-label="Filtros y orden">
          <div style="width:40px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 16px;"></div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
            <h3 style="font-size:18px; font-weight:800;">Ordenar y filtrar</h3>
            <button type="button" onclick="resetFilters()" style="font-size:13px; font-weight:700; color:var(--coral);">Restablecer</button>
          </div>

          <p style="font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;">Ordenar por</p>
          <div class="chip-group" style="margin-bottom:20px;">
            <button type="button" class="filter-chip ${STATE.sortBy === 'soon' ? 'active' : ''}" onclick="setSort('soon')">Más próximo</button>
            <button type="button" class="filter-chip ${STATE.sortBy === 'discount' ? 'active' : ''}" onclick="setSort('discount')">Mayor descuento</button>
            <button type="button" class="filter-chip ${STATE.sortBy === 'rating' ? 'active' : ''}" onclick="setSort('rating')">Mejor valorado</button>
          </div>

          <p style="font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;">Distancia a pie</p>
          <div class="chip-group" style="margin-bottom:24px;">
            <button type="button" class="filter-chip ${STATE.maxWalk === 99 ? 'active' : ''}" onclick="setWalk(99)">Todos</button>
            <button type="button" class="filter-chip ${STATE.maxWalk === 10 ? 'active' : ''}" onclick="setWalk(10)">&lt; 10 min a pie</button>
            <button type="button" class="filter-chip ${STATE.maxWalk === 15 ? 'active' : ''}" onclick="setWalk(15)">&lt; 15 min a pie</button>
          </div>

          <button type="button" class="btn-pill" onclick="toggleFilterSheet(false)">Aplicar filtros</button>
        </div>
      `;
    }

    /* ==========================================================================
       4. PANTALLA DE DETALLE DEL HUECO (VISOR 3 SLIDES, STEPPER, CHIPS, CTA FIJO)
       ========================================================================== */
    function viewSlotDetail() {
      const s = DB.slots.find(x => x.id === STATE.detailSlotId);
      if (!s) {
        navTo('home');
        return '';
      }
      const fav = isFavorite(s.id);
      const bookingsCount = getUserBookings().length;
      const unitPrice = finalPrice(s);
      const totalPrice = unitPrice * STATE.detailQty;
      const otherLive = DB.slots.filter(x => x.id !== s.id && x.st === 'live' && x.spotsLeft > 0 && x.t > Date.now());

      // Contenido de cada slide del visor interactivo
      let slideHtml = '';
      if (STATE.detailSlide === 0) {
        slideHtml = `
          <div style="text-align:center;">
            <div style="display:inline-flex; gap:8px; margin-bottom:12px;">
              <span class="disc-pill">−${esc(s.disc)}% DTO</span>
              <span class="time-pill">Hoy ${esc(formatHour(s.t))} · En ${minsUntil(s.t)} min</span>
            </div>
            <div style="margin:4px auto 8px;">${renderServiceArt(s.cat, 108)}</div>
            <p style="font-size:12px; color:var(--mute); font-weight:600;">
              ${s.spotsLeft === 1 ? '¡Última plaza disponible a este precio!' : `${s.spotsLeft} plazas libres a esta hora`}
            </p>
          </div>
        `;
      } else if (STATE.detailSlide === 1) {
        const st = s.stylist || { name: 'Equipo del Salón', role: 'Especialista', includes: ['Servicio completo'] };
        slideHtml = `
          <div style="width:100%;">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line);">
              <div class="avatar-pill" style="width:38px; height:38px; font-size:13px;">${esc(st.name.slice(0, 2).toUpperCase())}</div>
              <div>
                <div style="font-size:13.5px; font-weight:800;">Te atiende ${esc(st.name)}</div>
                <div style="font-size:11.5px; color:var(--coral); font-weight:600;">${esc(st.role)}</div>
              </div>
            </div>
            <div style="display:flex; flex-direction:column; gap:7px;">
              ${st.includes.map(item => `
                <div style="display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft);">
                  ${ICONS.check}
                  <span>${esc(item)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else {
        const revs = (s.reviews && s.reviews.length) ? s.reviews : [{ author: 'Cliente verificado', rating: 5, text: 'Atención rápida y resultado excelente.' }];
        slideHtml = `
          <div style="width:100%; display:flex; flex-direction:column; gap:10px;">
            <div style="font-size:12px; font-weight:700; color:var(--ink-soft);">Opiniones verificadas (${esc(s.reviewsCount)})</div>
            ${revs.map(r => `
              <div style="background:var(--card-soft); padding:10px 12px; border-radius:14px;">
                <div style="display:flex; justify-content:space-between; font-size:11.5px; font-weight:700; margin-bottom:3px;">
                  <span>${esc(r.author)}</span>
                  <span style="color:var(--gold);">★★★★★</span>
                </div>
                <p style="font-size:12px; color:var(--ink-soft); line-height:1.35;">“${esc(r.text)}”</p>
              </div>
            `).join('')}
          </div>
        `;
      }

      return `
        <div class="scroll-area with-sticky-cta fade-in">
          <!-- Cabecera Detalle -->
          <header class="topbar" style="position:relative;">
            <button type="button" class="icon-btn" onclick="navTo('home')" aria-label="Volver atrás">
              ${ICONS.back}
            </button>
            <div class="topbar-right">
              <button type="button" class="icon-btn" onclick="navTo('bookings')" aria-label="Ver mis citas">
                ${ICONS.bag}
                ${bookingsCount > 0 ? `<span class="badge-count">${bookingsCount}</span>` : ''}
              </button>
              <button type="button" class="icon-btn" onclick="toggleDetailMenu()" aria-label="Más opciones">
                ${ICONS.dots}
              </button>
            </div>

            ${STATE.detailMenuOpen ? `
              <div style="position:absolute; top:48px; right:0; background:#fff; border-radius:18px; padding:8px; box-shadow:0 14px 34px rgba(31,27,24,0.16); z-index:30; min-width:190px;">
                <button type="button" onclick="shareSlot(${s.id}); toggleDetailMenu(false)" style="width:100%; text-align:left; padding:10px 12px; border-radius:12px; font-size:13px; font-weight:600;">Compartir oferta</button>
                <button type="button" onclick="copyText('${esc(s.address)}', 'Dirección copiada'); toggleDetailMenu(false)" style="width:100%; text-align:left; padding:10px 12px; border-radius:12px; font-size:13px; font-weight:600;">Copiar dirección</button>
              </div>
            ` : ''}
          </header>

          <!-- Visor interactivo con flechas y puntos de paginación -->
          <div class="detail-viewer" ontouchstart="handleDetailTouchStart(event)" ontouchend="handleDetailTouchEnd(event)">
            <div class="slide-stage">
              <button type="button" class="slide-arrow prev" onclick="stepDetailSlide(-1)" aria-label="Anterior">‹</button>
              ${slideHtml}
              <button type="button" class="slide-arrow next" onclick="stepDetailSlide(1)" aria-label="Siguiente">›</button>

              ${ICONS.back}
            </button>
            <span style="font-weight:800; font-size:16px;">Publicar hueco</span>
            <div style="width:40px;"></div>
          </header>

          <form class="input-card" onsubmit="createBizSlot(event)">
            <div class="form-grid-2">
              <div class="field">
                <label for="new-cat">Categoría</label>
                <select id="new-cat">
                  <option value="Corte">Corte</option>
                  <option value="Color">Color</option>
                  <option value="Barba">Barba</option>
                  <option value="Uñas">Uñas</option>
                  <option value="Tratamientos">Tratamientos</option>
                </select>
              </div>
              <div class="field">
                <label for="new-spots">Plazas</label>
                <select id="new-spots">
                  <option value="1" selected>1 silla</option>
                  <option value="2">2 sillas</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="new-service">Nombre del servicio</label>
              <input type="text" id="new-service" placeholder="Ej. Corte y secado, Mechas, Manicura..." required>
            </div>

            <div class="field">
              <label for="new-stylist">Estilista que atiende</label>
              <input type="text" id="new-stylist" value="Bea Mendoza" required>
            </div>

            <div class="form-grid-2">
              <div class="field">
                <label for="new-in">Empieza en</label>
                <select id="new-in">
                  <option value="30">30 min</option>
                  <option value="45" selected>45 min</option>
                  <option value="60">1 hora</option>
                  <option value="90">1 h 30 min</option>
                  <option value="120">2 horas</option>
                </select>
              </div>
              <div class="field">
                <label for="new-dur">Duración</label>
                <select id="new-dur">
                  <option value="30">30 min</option>
                  <option value="45" selected>45 min</option>
                  <option value="60">60 min</option>
                  <option value="90">90 min</option>
                </select>
              </div>
            </div>

            <div class="form-grid-2">
              <div class="field">
                <label for="new-price">Precio habitual (€)</label>
                <input type="number" id="new-price" min="5" max="400" value="40" oninput="updateBizPreview()" required>
              </div>
              <div class="field">
                <label for="new-disc">Descuento</label>
                <select id="new-disc" onchange="updateBizPreview()">
                  <option value="15">−15%</option>
                  <option value="25" selected>−25%</option>
                  <option value="35">−35%</option>
                  <option value="40">−40%</option>
                  <option value="50">−50%</option>
                </select>
              </div>
            </div>

            <div id="biz-price-preview" style="background:var(--coral-soft); color:var(--coral-dark); padding:12px 14px; border-radius:14px; font-size:13px; font-weight:700; margin-bottom:16px;">
              Precio final para el cliente: 30€ (ahorra 10€)
            </div>

            <button type="submit" class="btn-pill">Lanzar al escaparate ahora</button>
          </form>
        </div>
      `;
    }

    function viewBizSettings() {
      const biz = DB.users[STATE.user];
      return `
        <div class="scroll-area fade-in">
          ${renderBizTopbar()}
          <h1 class="hero-title" style="font-size:24px;">Perfil del <strong>Salón</strong></h1>

          <form class="input-card" onsubmit="saveBizProfile(event)">
            <div class="field">
              <label for="biz-name">Nombre comercial</label>
              <input type="text" id="biz-name" value="${esc(biz.name)}" required>
            </div>
            <div class="field">
              <label for="biz-addr">Dirección y barrio</label>
              <input type="text" id="biz-addr" value="${esc(biz.address)}" required>
            </div>
            <button type="submit" class="btn-pill">Guardar cambios</button>
          </form>
        </div>
      `;
    }

    /* ==========================================================================
       CONTROLADOR PRINCIPAL Y ACCIONES INTERACTIVAS
       ========================================================================== */
    function render() {
      const views = {
        login: viewLogin,
        home: viewConsumerHome,
        detail: viewSlotDetail,
        checkout: viewCheckout,
        card_form: viewCardForm,
        success: viewBookingSuccess,
        bookings: viewBookings,
        favorites: viewFavorites,
        radar: viewRadar,
        how: viewHowItWorks,
        biz_dash: viewBizDash,
        biz_new: viewBizNew,
        biz_settings: viewBizSettings
      };

      const activeRenderer = views[STATE.view] || viewLogin;
      const drawerHtml = STATE.user ? renderDrawer() : '';
      $('view-container').innerHTML = `${activeRenderer()}${drawerHtml}`;
    }

    function navTo(view) {
      STATE.view = view;
      STATE.drawerOpen = false;
      STATE.filterOpen = false;
      STATE.detailMenuOpen = false;
      render();
    }

    function setAuthMode(mode) {
      STATE.authMode = mode;
      STATE.authError = '';
      render();
    }

    /** Inicio de sesión unificado con autodetección de rol ('cli' vs 'biz') */
    function handleUnifiedLogin(e) {
      e.preventDefault();
      const rawId = $('auth-id').value.trim().toLowerCase();
      const pw = $('auth-pw').value;

      const matchedKey = Object.keys(DB.users).find(k => {
        const u = DB.users[k];
        return k === rawId || (u.email && u.email.toLowerCase() === rawId);
      });

      if (matchedKey && DB.users[matchedKey].pw === pw) {
        const account = DB.users[matchedKey];
        STATE.user = matchedKey;
        STATE.role = account.role;
        STATE.authError = '';
        toast(`Hola, ${account.name.split(' ')[0]}`);
        navTo(account.role === 'biz' ? 'biz_dash' : 'home');
      } else {
        STATE.authError = 'Credenciales no válidas. Prueba con iker / 123 o marea / 123.';
        render();
      }
    }

    function quickLogin(userKey) {
      const account = DB.users[userKey];
      if (!account) return;
      STATE.user = userKey;
      STATE.role = account.role;
      STATE.authError = '';
      toast(`Sesión iniciada como ${account.name}`);
      navTo(account.role === 'biz' ? 'biz_dash' : 'home');
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = $('reg-name').value.trim();
      const rawUser = $('reg-user').value.trim().toLowerCase().replace(/[^a-z0-9@._-]/g, '');
      const pw = $('reg-pass').value;

      if (!name || !rawUser || pw.length < 3) {
        STATE.authError = 'Completa tu nombre, usuario y una contraseña de al menos 3 caracteres.';
        render();
        return;
      }
      if (DB.users[rawUser]) {
        STATE.authError = 'Ese usuario ya existe. Prueba con otro o inicia sesión.';
        render();
        return;
      }

      DB.users[rawUser] = {
        pw,
        role: 'cli',
        name,
        email: rawUser.includes('@') ? rawUser : `${rawUser}@huecos.es`,
        cards: [],
        favorites: [101],
        radarPhone: ''
      };
      saveData();

      STATE.user = rawUser;
      STATE.role = 'cli';
      STATE.authError = '';
      toast(`Bienvenido/a, ${name.split(' ')[0]}`);
      navTo('home');
    }

    function logout() {
      STATE.user = null;
      STATE.role = null;
      STATE.drawerOpen = false;
      STATE.authError = '';
      navTo('login');
      toast('Sesión cerrada');
    }

    function toggleDrawer(open) {
      STATE.drawerOpen = open;
      render();
    }

    function drawerNav(view) {
      STATE.drawerOpen = false;
      navTo(view);
    }

    function toggleFilterSheet(open) {
      STATE.filterOpen = open;
      render();
    }

    function handleSearchInput(val) {
      STATE.searchQuery = val;
      STATE.featuredIndex = 0;
      render();
      const inp = $('search-input');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(val.length, val.length);
      }
    }

    function selectCategory(cat) {
      STATE.selectedCat = cat;
      STATE.featuredIndex = 0;
      render();
    }

    function setSort(sortBy) {
      STATE.sortBy = sortBy;
      render();
    }

    function setWalk(maxWalk) {
      STATE.maxWalk = maxWalk;
      render();
    }

    function resetFilters() {
      STATE.selectedCat = 'Todo';
      STATE.searchQuery = '';
      STATE.sortBy = 'soon';
      STATE.maxWalk = 99;
      STATE.featuredIndex = 0;
      STATE.filterOpen = false;
      render();
    }

    /** Detecta qué tarjeta está centrada en el carrusel horizontal para elevarla */
    function handleCarouselScroll(el) {
      const cardWidth = 210;
      const newIdx = Math.round(el.scrollLeft / cardWidth);
      if (newIdx !== STATE.featuredIndex) {
        STATE.featuredIndex = newIdx;
        const cards = el.querySelectorAll('.slot-card');
        cards.forEach((c, i) => c.classList.toggle('elevated', i === newIdx));
      }
    }

    function toggleFavorite(slotId) {
      if (!STATE.user || STATE.role !== 'cli') return;
      const favs = DB.users[STATE.user].favorites || [];
      const idx = favs.indexOf(slotId);
      if (idx >= 0) {
        favs.splice(idx, 1);
        toast('Quitado de favoritos');
      } else {
        favs.push(slotId);
        toast('Guardado en favoritos');
      }
      DB.users[STATE.user].favorites = favs;
      saveData();
      render();
    }

    function openSlotDetail(slotId) {
      STATE.detailSlotId = slotId;
      STATE.detailSlide = 0;
      STATE.detailQty = 1;
      STATE.detailMenuOpen = false;
      navTo('detail');
    }

    function quickBookFromCard(slotId) {
      STATE.detailSlotId = slotId;
      STATE.detailQty = 1;
      navTo('checkout');
    }

    function stepDetailSlide(dir) {
      STATE.detailSlide = (STATE.detailSlide + dir + 3) % 3;
      render();
    }

    function setDetailSlide(idx) {
      STATE.detailSlide = idx;
      render();
    }

    let touchStartX = 0;
    function handleDetailTouchStart(e) {
      touchStartX = e.changedTouches[0].clientX;
    }

    function handleDetailTouchEnd(e) {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) {
        stepDetailSlide(dx < 0 ? 1 : -1);
      }
    }

    function changeDetailQty(delta) {
      const s = DB.slots.find(x => x.id === STATE.detailSlotId);
      if (!s) return;
      const next = STATE.detailQty + delta;
      if (next >= 1 && next <= s.spotsLeft) {
        STATE.detailQty = next;
        render();
      }
    }

    function toggleDetailMenu(force) {
      STATE.detailMenuOpen = typeof force === 'boolean' ? force : !STATE.detailMenuOpen;
      render();
    }

    function copyText(text, msg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        toast(msg);
      } catch (e) {
        toast('No se pudo copiar');
      }
      document.body.removeChild(ta);
    }

    function shareSlot(slotId) {
      const s = DB.slots.find(x => x.id === slotId);
      if (!s) return;
      copyText(`${s.s} en ${s.biz} hoy a las ${formatHour(s.t)} por ${eur(finalPrice(s))} (−${s.disc}%) en Huecos`, 'Enlace de oferta copiado');
    }

    function goToCheckout() {
      navTo('checkout');
    }

    function openCardForm(returnView) {
      STATE.cardReturnView = returnView;
      navTo('card_form');
    }

    function formatCardNum(inp) {
      const digits = inp.value.replace(/\D/g, '').slice(0, 16);
      inp.value = digits.replace(/(.{4})/g, '$1 ').trim();
    }

    function formatCardExp(inp) {
      const digits = inp.value.replace(/\D/g, '').slice(0, 4);
      inp.value = digits.length > 2 ? `${digits.slice(0, 2)}/${digits.slice(2)}` : digits;
    }

    function handleCardSubmit(e) {
      e.preventDefault();
      const digits = $('card-num').value.replace(/\D/g, '');
      if (digits.length < 13) {
        toast('Introduce un número de tarjeta válido');
        return;
      }
      const masked = `•••• ${digits.slice(-4)}`;
      const u = DB.users[STATE.user];
      if (!u.cards.includes(masked)) {
        u.cards.unshift(masked);
        saveData();
      }
      if (STATE.cardReturnView === 'checkout') {
        completeBooking(`Tarjeta ${masked}`);
      } else {
        toast('Tarjeta guardada');
        navTo(STATE.cardReturnView);
      }
    }

    function completeBooking(method) {
      const s = DB.slots.find(x => x.id === STATE.detailSlotId);
      if (!s || s.st !== 'live' || s.spotsLeft < STATE.detailQty) {
        toast('Este hueco ya no tiene plazas suficientes');
        navTo('home');
        return;
      }

      const u = DB.users[STATE.user];
      const total = finalPrice(s) * STATE.detailQty;
      const pin = String(Math.floor(1000 + Math.random() * 9000));

      s.spotsLeft -= STATE.detailQty;
      if (s.spotsLeft <= 0) {
        s.spotsLeft = 0;
        s.st = 'booked';
      }
      s.bookings = s.bookings || [];
      s.bookings.push({
        cliId: STATE.user,
        cliName: u.name,
        qty: STATE.detailQty,
        pin,
        method,
        total
      });

      STATE.lastConfirmation = {
        service: s.s,
        biz: s.biz,
        time: s.t,
        qty: STATE.detailQty,
        pin,
        method,
        total
      };

      saveData();
      navTo('success');
    }

    function releaseUserBooking(slotId, bookingIdx) {
      const s = DB.slots.find(x => x.id === slotId);
      if (!s || !s.bookings || !s.bookings[bookingIdx]) return;
      const [removed] = s.bookings.splice(bookingIdx, 1);
      s.spotsLeft += removed.qty;
      s.st = 'live';
      saveData();
      toast('Cita liberada · Hueco devuelto');
      render();
    }

    function saveRadar(e) {
      e.preventDefault();
      const tel = $('radar-tel').value.trim();
      if (!tel) return;
      DB.users[STATE.user].radarPhone = tel;
      saveData();
      toast('Radar de WhatsApp activado');
      render();
    }

    /* ==========================================================================
       ACCIONES DEL PANEL DE SALÓN
       ========================================================================== */
    function updateBizPreview() {
      const p = Number($('new-price')?.value || 0);
      const d = Number($('new-disc')?.value || 0);
      const fp = Math.round(p * (1 - d / 100));
      const box = $('biz-price-preview');
      if (box) {
        box.textContent = `Precio final para el cliente: ${eur(fp)} (ahorra ${eur(Math.max(0, p - fp))})`;
      }
    }

    function createBizSlot(e) {
      e.preventDefault();
      const cat = $('new-cat').value;
      const spots = Number($('new-spots').value);
      const service = $('new-service').value.trim();
      const stylistName = $('new-stylist').value.trim();
      const inMins = Number($('new-in').value);
      const dur = Number($('new-dur').value);
      const price = Number($('new-price').value);
      const disc = Number($('new-disc').value);
      const biz = DB.users[STATE.user];

      if (!service || price <= 0) return;

      DB.slots.unshift({
        id: Date.now(),
        cat,
        s: service,
        p: price,
        d: dur,
        t: Date.now() + inMins * 60000,
        disc,
        walkMins: 6,
        rating: 4.9,
        reviewsCount: 125,
        spotsLeft: spots,
        st: 'live',
        bizId: STATE.user,
        biz: biz.name,
        address: biz.address,
        stylist: {
          name: stylistName || 'Equipo del Salón',
          role: 'Especialista del salón',
          includes: ['Diagnóstico personalizado', 'Productos profesionales incluidos', 'Acabado de salón']
        },
        reviews: [
          { author: 'Cliente verificado', rating: 5, text: 'Atención rápida y puntual.' }
        ],
        bookings: []
      });

      saveData();
      toast('Hueco publicado en vivo');
      navTo('biz_dash');
    }

    function removeBizSlot(slotId) {
      DB.slots = DB.slots.filter(s => s.id !== slotId);
      saveData();
      toast('Hueco retirado');
      render();
    }

    function saveBizProfile(e) {
      e.preventDefault();
      const name = $('biz-name').value.trim();
      const addr = $('biz-addr').value.trim();
      if (!name || !addr) return;
      DB.users[STATE.user].name = name;
      DB.users[STATE.user].address = addr;
      DB.slots.forEach(s => {
        if (s.bizId === STATE.user) {
          s.biz = name;
          s.address = addr;
        }
      });
      saveData();
      toast('Perfil del salón guardado');
      navTo('biz_dash');
    }

    function resetDemo() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      DB = getDefaultData();
      STATE.user = null;
      STATE.role = null;
      STATE.drawerOpen = false;
      STATE.selectedCat = 'Todo';
      STATE.searchQuery = '';
      navTo('login');
      toast('Datos de demostración restaurados');
    }

    let toastTimer;
    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
    }

    /* Refresco periódico de minutos restantes */
    setInterval(() => {
      if (STATE.view === 'home' && !STATE.filterOpen && !STATE.drawerOpen) {
        render();
      }
    }, 30000);

    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
