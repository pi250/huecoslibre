<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F2">
<title>Huecos · Última hora</title>
<!-- Mezcla de tipografía utilitaria (Space Grotesk) y editorial clásica (Fraunces) -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0A0A0A;
  --paper: #F4F4F4; /* No es blanco puro, evita la fatiga visual */
  --mute: #666666;
  --line: #0A0A0A;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { overscroll-behavior: none; }

/* Textura de ruido fotográfico para dar tacto humano y romper lo "digital" */
body {
  background-color: var(--paper);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
  color: var(--ink);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}

button, input { font: inherit; color: inherit; border: none; background: none; }
button { cursor: pointer; transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
button:active { transform: scale(0.96); }

/* Tipografía de contraste */
.serif { font-family: 'Fraunces', serif; letter-spacing: -0.03em; }
.italic { font-style: italic; }

header {
  padding: calc(24px + env(safe-area-inset-top)) 24px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1.5px solid var(--line);
}
.logo { font-size: 24px; font-weight: 600; text-transform: uppercase; letter-spacing: -0.04em; }

main { max-width: 560px; margin: 0 auto; padding: 40px 24px 120px; }

h1 { font-size: clamp(32px, 8vw, 48px); font-weight: 300; line-height: 1.05; margin-bottom: 16px; }
.lead { color: var(--mute); font-size: 16px; margin-bottom: 48px; max-width: 90%; }

/* Segmented Control Asimétrico */
.tabs { display: flex; gap: 12px; margin-bottom: 32px; border-bottom: 1px solid rgba(10,10,10,0.1); padding-bottom: 16px;}
.tabs button { font-weight: 500; color: var(--mute); text-transform: uppercase; font-size: 13px; letter-spacing: 0.05em; }
.tabs button[aria-pressed=true] { color: var(--ink); position: relative; }
.tabs button[aria-pressed=true]::after { content: ''; position: absolute; bottom: -17px; left: 0; width: 100%; height: 1.5px; background: var(--ink); }

/* Listado de Ofertas (Estilo Revista) */
.tk {
  position: relative;
  padding: 24px 0;
  border-bottom: 1.5px solid var(--line);
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 16px;
  align-items: start;
}
.tk-time { font-size: 32px; line-height: 1; }
.tk-time small { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--mute); margin-top: 8px; }

.tk-info h3 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.tk-info p { color: var(--mute); font-size: 14px; margin-bottom: 16px; }

.tk-price { display: flex; gap: 12px; align-items: baseline; margin-bottom: 20px;}
.now { font-size: 24px; font-weight: 600; }
.old { text-decoration: line-through; color: var(--mute); }

/* Etiqueta rota artesanal (El Detalle Humano) */
.tag {
  position: absolute;
  top: 16px;
  right: 0;
  background: var(--ink);
  color: var(--paper);
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  transform: rotate(3deg);
  box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
}
.tag.gift { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); transform: rotate(-2deg); }

/* Botones Brutalistas */
.btn {
  background: var(--ink);
  color: var(--paper);
  padding: 16px 24px;
  font-weight: 500;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  width: 100%;
  display: block;
  text-align: center;
}
.btn.o { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }

/* Modal simplificado */
.veil { position: fixed; inset: 0; background: rgba(244,244,244,0.9); z-index: 50; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.veil.on { opacity: 1; pointer-events: auto; }
.sheet { background: var(--paper); width: 100%; max-width: 440px; padding: 40px 24px; border: 1.5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); transform: translateY(20px); transition: transform 0.3s; }
.veil.on .sheet { transform: translateY(0); }

/* Toast */
.toast { position: fixed; bottom: 40px; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 12px 24px; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 100; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="app"></div>
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const eur = n => n + '€';
const hh = d => d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

// Mock data realista
const SV = [
  { id: 1, n: 'Corte de autor y secado', p: 38, d: 60 },
  { id: 2, n: 'Color completo y mechas', p: 85, d: 120 }
];
const SL = [
  { id: 101, s: 1, t: new Date(Date.now() + 45*60000), disc: 20, st: 'live', sty: 'Marta' },
  { id: 102, s: 2, t: new Date(Date.now() + 120*60000), disc: 30, st: 'live', sty: 'Elena' },
  { id: 103, s: 1, t: new Date(Date.now() + 200*60000), disc: 0, gift: 'Tratamiento Olaplex', st: 'live', sty: 'Dani' }
];

const sv = s => SV.find(x => x.id === s.s);
const cp = s => Math.round(sv(s).p * (1 - s.disc / 100));

function viewBook() {
  const L = SL.filter(s => s.st === 'live');
  return `
    <header>
      <div class="logo">Huecos</div>
      <button style="text-decoration:underline; font-weight:500; font-size:14px">Entrar</button>
    </header>
    <main>
      <h1 class="serif">Alguien acaba de <i class="italic">cancelar</i>.</h1>
      <p class="lead">Su pérdida es tu descuento. Huecos de última hora en salones premium de tu ciudad.</p>
      
      <div class="tabs">
        <button aria-pressed="true">Para hoy</button>
        <button aria-pressed="false">Mañana</button>
      </div>

      <div class="list">
        ${L.map(s => {
          const x = sv(s);
          const min = Math.round((s.t - Date.now()) / 60000);
          const tag = s.disc 
            ? `<div class="tag">−${s.disc}% OFF</div>` 
            : `<div class="tag gift">REGALO INCLUIDO</div>`;
            
          return `
            <div class="tk">
              ${tag}
              <div class="tk-time serif">${hh(s.t)}<small>En ${min} min</small></div>
              <div class="tk-info">
                <h3>${x.n}</h3>
                <p>${s.sty} se ha quedado libre. Duración: ${x.d} min.</p>
                <div class="tk-price">
                  <span class="now">${eur(cp(s))}</span>
                  ${s.disc ? `<span class="old">${eur(x.p)}</span>` : ''}
                </div>
                <button class="btn o" onclick="checkout(${s.id})">Bloquear hueco</button>
              </div>
            </div>`;
        }).join('')}
      </div>
    </main>
  `;
}

function checkout(id) {
  const s = SL.find(x => x.id === id);
  const x = sv(s);
  $('sheet').innerHTML = `
    <h2 class="serif" style="font-size:28px; font-weight:300; margin-bottom:8px">Confirma tu cita</h2>
    <p style="color:var(--mute); margin-bottom:24px; font-size:14px">${x.n} a las ${hh(s.t)}</p>
    <div style="border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:16px 0; margin-bottom:32px; display:flex; justify-content:space-between; font-size:18px; font-weight:600">
      <span>Total en el salón</span><span>${eur(cp(s))}</span>
    </div>
    <button class="btn" onclick="confirm(${id})">Confirmar asistencia</button>
    <button class="btn o" style="border:none; margin-top:8px" onclick="closeModal()">Cancelar</button>
  `;
  $('veil').classList.add('on');
}

function confirm(id) {
  SL.find(x => x.id === id).st = 'booked';
  closeModal();
  $('app').innerHTML = viewBook();
  
  const t = $('toast');
  t.textContent = 'HUECO CONFIRMADO';
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 3000);
}

function closeModal() { $('veil').classList.remove('on'); }

$('app').innerHTML = viewBook();
</script>
</body>
</html>
