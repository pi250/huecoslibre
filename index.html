<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gappy · Reservas de última hora cerca de ti</title>
  <meta name="description" content="Alguien acaba de cancelar su cita. Aprovecha huecos de última hora en peluquerías, estética, barberías y clínicas de tu barrio con descuentos directos.">

  <!-- Favicon SVG oficial de Gappy -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2306183D'/%3E%3Cpath d='M22 14v5M38 14v5M30 27v7h6' stroke='%23FFF' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M43 26c0-4.4-3.6-8-8-8H23c-5.5 0-10 4.5-10 10v11c0 5.5 4.5 10 10 10h11' stroke='%23FFF' stroke-width='5.5' stroke-linecap='round' fill='none'/%3E%3Cpath d='M46 15l4-4M49 20l5-1' stroke='%2300D8B6' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M44 31c-4.4 0-8 3.5-8 7.9 0 5.6 8 13.1 8 13.1s8-7.5 8-13.1c0-4.4-3.6-7.9-8-7.9zm0 10.6a2.7 2.7 0 1 1 0-5.4 2.7 2.7 0 0 1 0 5.4z' fill='%2300D8B6'/%3E%3C/svg%3E">

  <!-- Tipografías modernas redondeadas y editoriales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. TOKENS DE MARCA GAPPY (AZUL MARINO #06183D + MENTA #00D8B6 + CORAL #FF6B35)
       ========================================================================== */
    :root {
      --bg-outer: #EFE9E3;
      --surface-bg: #FAF6F2;
      --surface-warm: #F5EFE9;
      --card: #FFFFFF;
      --card-soft: #F7F5F2;
      --navy: #06183D;
      --navy-mid: #0C2A6E;
      --mint: #00D8B6;
      --mint-dark: #00A88D;
      --mint-soft: rgba(0, 216, 182, 0.14);
      --coral: #FF6B35;
      --coral-dark: #E5531E;
      --coral-soft: rgba(255, 107, 53, 0.12);
      --ink: #141B29;
      --ink-soft: #4F5969;
      --mute: #8892A2;
      --line: rgba(6, 24, 61, 0.08);
      --gold: #F5A623;
      --shadow-card: 0 12px 28px rgba(6, 24, 61, 0.07);
      --shadow-elevated: 0 18px 36px rgba(6, 24, 61, 0.13);
      --shadow-shell: 0 28px 70px rgba(6, 24, 61, 0.18);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg-outer);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }

    /* Marco móvil centrado en escritorio, pantalla completa en móvil */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 890px;
      background: linear-gradient(180deg, #FCF9F6 0%, var(--surface-bg) 55%, var(--surface-warm) 100%);
      border-radius: 36px;
      box-shadow: var(--shadow-shell), 0 0 0 8px rgba(255, 255, 255, 0.65);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Destellos ambientales suaves */
    .app-shell::before {
      content: "";
      position: absolute;
      top: -90px;
      right: -80px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 216, 182, 0.10) 0%, rgba(0, 216, 182, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app-shell::after {
      content: "";
      position: absolute;
      bottom: 60px;
      left: -90px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 107, 53, 0.08) 0%, rgba(255, 107, 53, 0) 72%);
      pointer-events: none;
      z-index: 0;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        background: var(--surface-bg);
      }
      .app-shell {
        max-width: 100%;
        max-height: 100dvh;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    .scroll-area {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: calc(16px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
      scrollbar-width: none;
    }

    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    .scroll-area.with-sticky-cta {
      padding-bottom: calc(98px + env(safe-area-inset-bottom));
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
      border: none;
      background: none;
    }

    button {
      cursor: pointer;
      transition: transform 0.18s var(--ease-out), background-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--mint-dark);
      outline-offset: 2px;
    }

    .serif {
      font-family: 'Fraunces', Georgia, serif;
      letter-spacing: -0.02em;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       2. CABECERA SUPERIOR (HAMBURGUESA + LOGO HORIZONTAL GAPPY + BOLSA + AVATAR)
       ========================================================================== */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      min-height: 44px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      box-shadow: 0 4px 12px rgba(6, 24, 61, 0.06);
      position: relative;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: #F4F7FB;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-count {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--coral);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(255, 107, 53, 0.45);
    }

    .avatar-pill {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      color: var(--mint);
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(6, 24, 61, 0.22);
      border: 2px solid #FFFFFF;
      flex-shrink: 0;
    }

    /* ==========================================================================
       3. HERO Y BARRA DE BÚSQUEDA INTELIGENTE (SIN DISTINCIÓN DE TILDES)
       ========================================================================== */
    .hero-title {
      font-size: 25px;
      line-height: 1.18;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 16px;
    }

    .hero-title strong {
      display: block;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.03em;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border-radius: 18px;
      padding: 6px 8px 6px 15px;
      box-shadow: var(--shadow-card);
      margin-bottom: 20px;
      border: 1.5px solid transparent;
      transition: border-color 0.2s ease;
    }

    .search-bar:focus-within {
      border-color: var(--mint);
    }

    .search-bar input {
      flex: 1;
      font-size: 14px;
      color: var(--ink);
      min-width: 0;
      padding: 8px 0;
    }

    .search-bar input::placeholder {
      color: var(--mute);
    }

    .filter-trigger {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: var(--card-soft);
      color: var(--navy);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .filter-trigger.has-filters {
      background: var(--navy);
      color: var(--mint);
    }

    /* ==========================================================================
       4. CATEGORÍAS HORIZONTALES
       ========================================================================== */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.02em;
    }

    .section-sub {
      font-size: 12px;
      color: var(--coral);
      font-weight: 700;
    }

    .cat-row {
      display: flex;
      gap: 11px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin: 0 -20px 18px;
      padding-left: 20px;
      padding-right: 20px;
      scrollbar-width: none;
    }

    .cat-row::-webkit-scrollbar {
      display: none;
    }

    .cat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      width: 68px;
    }

    .cat-box {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px rgba(6, 24, 61, 0.06);
      color: var(--navy);
      transition: all 0.22s var(--ease-out);
    }

    .cat-item.active .cat-box {
      background: var(--navy);
      color: var(--mint);
      box-shadow: 0 10px 22px rgba(6, 24, 61, 0.24);
      transform: translateY(-2px);
    }

    .cat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-soft);
      text-align: center;
    }

    .cat-item.active .cat-label {
      color: var(--navy);
      font-weight: 800;
    }

    /* ==========================================================================
       5. CARRUSEL HORIZONTAL: HUECOS URGENTES (PRÓXIMAS 2H)
       ========================================================================== */
    .featured-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 10px 20px 20px;
      margin: 0 -20px 6px;
      scrollbar-width: none;
      align-items: center;
    }

    .featured-row::-webkit-scrollbar {
      display: none;
    }

    .slot-card {
      scroll-snap-align: center;
      flex-shrink: 0;
      width: 204px;
      background: var(--card);
      border-radius: 24px;
      padding: 14px;
      box-shadow: var(--shadow-card);
      position: relative;
      transition: transform 0.28s var(--ease-out), box-shadow 0.28s var(--ease-out);
      cursor: pointer;
    }

    .slot-card.elevated {
      width: 218px;
      padding: 16px;
      transform: translateY(-5px);
      box-shadow: var(--shadow-elevated);
      border: 1.5px solid rgba(0, 216, 182, 0.45);
    }

    .slot-top-badges {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .disc-pill {
      background: var(--coral);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 999px;
    }

    .time-pill {
      background: var(--navy);
      color: var(--mint);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .slot-visual {
      height: 88px;
      border-radius: 18px;
      background: linear-gradient(145deg, #F2F7FB 0%, #E7F6F3 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 11px;
    }

    .slot-card.elevated .slot-visual {
      height: 100px;
    }

    .slot-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.25;
      margin-bottom: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .slot-salon {
      font-size: 11.5px;
      color: var(--ink-soft);
      font-weight: 600;
      margin-bottom: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slot-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-soft);
      margin-bottom: 10px;
    }

    .slot-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .price-group {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .price-now {
      font-size: 17px;
      font-weight: 800;
      color: var(--navy);
    }

    .price-old {
      font-size: 12px;
      color: var(--mute);
      text-decoration: line-through;
    }

    .mini-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--card-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--mute);
    }

    .mini-icon-btn.fav-on {
      color: #E53935;
      background: rgba(229, 57, 53, 0.1);
    }

    .mini-icon-btn.book-quick {
      background: var(--coral);
      color: #FFFFFF;
    }

    /* ==========================================================================
       6. MEJORES OFERTAS DE HOY (LISTADO DETALLADO CON DISTANCIA A PIE)
       ========================================================================== */
    .deals-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .deal-row-card {
      background: var(--card);
      border-radius: 22px;
      padding: 13px;
      box-shadow: 0 8px 20px rgba(6, 24, 61, 0.05);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s var(--ease-out);
    }

    .deal-row-card:hover {
      transform: translateY(-2px);
    }

    .deal-row-art {
      width: 62px;
      height: 62px;
      border-radius: 16px;
      background: linear-gradient(145deg, #F2F7FB 0%, #E7F6F3 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .deal-row-badge {
      position: absolute;
      top: -5px;
      left: -5px;
      background: var(--coral);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .deal-row-body {
      flex: 1;
      min-width: 0;
    }

    .deal-row-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .deal-row-biz {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }

    .deal-row-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--mute);
      font-weight: 600;
    }

    .deal-row-right {
      text-align: right;
      flex-shrink: 0;
    }

    /* ==========================================================================
       7. PANTALLA DE DETALLE DEL HUECO
       ========================================================================== */
    .detail-viewer {
      background: var(--card);
      border-radius: 26px;
      padding: 18px;
      box-shadow: var(--shadow-card);
      margin-bottom: 18px;
      position: relative;
    }

    .slide-stage {
      min-height: 185px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 6px 26px;
    }

    .slide-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--card-soft);
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .slide-arrow.prev { left: 0; }
    .slide-arrow.next { right: 0; }

    .dots-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(6, 24, 61, 0.16);
      transition: all 0.22s ease;
    }

    .dot.active {
      width: 22px;
      background: var(--mint-dark);
    }

    .detail-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 6px;
    }

    .detail-title {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.2;
      color: var(--navy);
      letter-spacing: -0.02em;
    }

    .detail-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .pills-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 16px;
    }

    .info-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      padding: 8px 12px;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      box-shadow: 0 4px 12px rgba(6, 24, 61, 0.05);
    }

    .human-note-card {
      background: #FFFFFF;
      border-radius: 22px;
      padding: 15px;
      box-shadow: var(--shadow-card);
      margin-bottom: 18px;
      border-left: 4px solid var(--mint);
    }

    .also-free-row {
      display: flex;
      gap: 11px;
      overflow-x: auto;
      padding: 4px 20px 10px;
      margin: 0 -20px;
      scrollbar-width: none;
    }

    .also-free-row::-webkit-scrollbar {
      display: none;
    }

    .mini-deal-card {
      flex-shrink: 0;
      width: 154px;
      background: var(--card);
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 6px 16px rgba(6, 24, 61, 0.05);
      cursor: pointer;
    }

    .sticky-cta-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(245, 239, 233, 0) 0%, var(--surface-warm) 35%);
      z-index: 15;
    }

    /* ==========================================================================
       8. BOTONES PÍLDORA Y TARJETAS DE FORMULARIO
       ========================================================================== */
    .btn-pill {
      width: 100%;
      background: var(--coral);
      color: #FFFFFF;
      padding: 16px 22px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 12px 24px rgba(255, 107, 53, 0.34);
    }

    .btn-pill:hover {
      background: var(--coral-dark);
    }

    .btn-pill.navy {
      background: var(--navy);
      color: #FFFFFF;
      box-shadow: 0 12px 24px rgba(6, 24, 61, 0.25);
    }

    .btn-pill.secondary {
      background: var(--card);
      color: var(--navy);
      box-shadow: var(--shadow-card);
    }

    .btn-pill.apple {
      background: #11151C;
      color: #FFFFFF;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.16);
    }

    .input-card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow-card);
      margin-bottom: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      background: var(--card-soft);
      border: 1.5px solid rgba(6, 24, 61, 0.08);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14.5px;
      color: var(--ink);
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--mint-dark);
      background: #FFFFFF;
      outline: none;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    /* ==========================================================================
       9. MENÚ LATERAL DESLIZABLE (DRAWER) Y SHEET DE FILTROS
       ========================================================================== */
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(6, 24, 61, 0.42);
      backdrop-filter: blur(3px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 84%;
      max-width: 326px;
      background: linear-gradient(180deg, #FFFFFF 0%, var(--surface-bg) 100%);
      border-radius: 0 30px 30px 0;
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
      z-index: 50;
      transform: translateX(-105%);
      transition: transform 0.3s var(--ease-out);
      display: flex;
      flex-direction: column;
      box-shadow: 16px 0 40px rgba(6, 24, 61, 0.16);
    }

    .drawer-panel.open {
      transform: translateX(0);
    }

    .drawer-profile-card {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px;
      border-radius: 20px;
      background: var(--card-soft);
      border: 1px solid var(--line);
      margin-bottom: 10px;
      text-align: left;
      width: 100%;
    }

    .drawer-profile-card:hover {
      border-color: var(--mint);
      background: #FFFFFF;
    }

    .drawer-nav-scroll {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      padding: 2px 2px 10px;
    }

    .drawer-nav-scroll::-webkit-scrollbar {
      display: none;
    }

    .drawer-section-label {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--mute);
      padding: 12px 10px 6px;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 3px;
      text-align: left;
    }

    .drawer-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .drawer-item-left span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .drawer-item.active {
      background: var(--navy);
      color: #FFFFFF;
      box-shadow: 0 8px 18px rgba(6, 24, 61, 0.2);
    }

    .drawer-item.active svg {
      color: var(--mint);
    }

    .drawer-item:not(.active):hover {
      background: rgba(6, 24, 61, 0.05);
    }

    /* Interruptores (Toggles), barra de seguridad y bloques legales */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }

    .switch-row:last-child {
      border-bottom: none;
      padding-bottom: 2px;
    }

    .switch-row:first-child {
      padding-top: 2px;
    }

    .toggle-switch {
      position: relative;
      width: 46px;
      height: 26px;
      border-radius: 999px;
      background: rgba(6, 24, 61, 0.16);
      flex-shrink: 0;
      transition: background-color 0.22s ease;
    }

    .toggle-switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 2px 6px rgba(6, 24, 61, 0.22);
      transition: transform 0.22s var(--ease-out);
    }

    .toggle-switch.on {
      background: var(--mint-dark);
    }

    .toggle-switch.on::after {
      transform: translateX(20px);
    }

    .strength-meter {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 8px;
    }

    .strength-seg {
      height: 5px;
      border-radius: 99px;
      background: rgba(6, 24, 61, 0.1);
      transition: background-color 0.2s ease;
    }

    .legal-section {
      background: var(--card);
      border-radius: 22px;
      padding: 16px 18px;
      box-shadow: 0 8px 20px rgba(6, 24, 61, 0.05);
      margin-bottom: 12px;
    }

    .legal-section h2 {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .legal-section p, .legal-section li {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.55;
    }

    .legal-section ul {
      padding-left: 18px;
      margin-top: 6px;
    }

    .legal-section li {
      margin-bottom: 4px;
    }

    details.faq-item {
      background: var(--card);
      border-radius: 20px;
      padding: 14px 16px;
      box-shadow: 0 6px 16px rgba(6, 24, 61, 0.05);
      margin-bottom: 10px;
    }

    details.faq-item summary {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--navy);
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    details.faq-item summary::-webkit-details-marker {
      display: none;
    }

    details.faq-item p {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    .drawer-panel.open {
      transform: translateX(0);
    }

    .drawer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 14px;
      border-radius: 15px;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .drawer-item-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .drawer-item.active {
      background: var(--navy);
      color: #FFFFFF;
      box-shadow: 0 8px 18px rgba(6, 24, 61, 0.2);
    }

    .drawer-item.active svg {
      color: var(--mint);
    }

    .drawer-item:not(.active):hover {
      background: rgba(6, 24, 61, 0.05);
    }

    .sheet-panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: #FFFFFF;
      border-radius: 30px 30px 0 0;
      padding: 20px 22px calc(26px + env(safe-area-inset-bottom));
      z-index: 50;
      transform: translateY(105%);
      transition: transform 0.3s var(--ease-out);
      box-shadow: 0 -16px 40px rgba(6, 24, 61, 0.16);
    }

    .sheet-panel.open {
      transform: translateY(0);
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .filter-chip {
      padding: 9px 13px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      background: var(--card-soft);
      color: var(--ink-soft);
      border: 1.5px solid transparent;
    }

    .filter-chip.active {
      background: var(--navy);
      color: var(--mint);
    }

    /* Toast flotante */
    .toast {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -24px);
      background: var(--navy);
      color: #FFFFFF;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      z-index: 80;
      transition: opacity 0.22s ease, transform 0.25s var(--ease-out);
      box-shadow: 0 10px 24px rgba(6, 24, 61, 0.28);
      border: 1px solid rgba(0, 216, 182, 0.35);
      white-space: nowrap;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .fade-in {
      animation: fadeIn 0.26s var(--ease-out);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div id="view-container" style="display:flex; flex-direction:column; flex:1; overflow:hidden;"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    /**
     * ==========================================================================
     * GAPPY · RESERVAS DE ÚLTIMA HORA CERCA DE TI
     * - Logotipos vectoriales oficiales de Gappy (Squircle App Icon + Horizontal Pill)
     * - Inicio de sesión primero con autodetección automática de rol (Cliente / Salón)
     * - Búsqueda inteligente insensible a tildes, diacríticos y mayúsculas
     * ==========================================================================
     */

    const STORAGE_KEY = 'gappy_marketplace_v1';
    const $ = id => document.getElementById(id);

    /** Sanitización segura contra XSS */
    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Normalización de texto sin tildes, diacríticos ni mayúsculas.
     * Ejemplo: "Salón Marea" -> "salon marea", "Estética" -> "estetica", "Uñas" -> "unas"
     */
    function normalizeText(str) {
      return String(str ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();
    }

    const eur = n => `${n}€`;
    const formatHour = ms => new Date(ms).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    const minsUntil = ms => Math.max(5, Math.round((ms - Date.now()) / 60000));
    const finalPrice = slot => Math.round(slot.p * (1 - slot.disc / 100));

    /* ==========================================================================
       1. LOGOTIPOS OFICIALES DE GAPPY (SVG DE ALTA PRECISIÓN)
       ========================================================================== */

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultData();
        const parsed = JSON.parse(raw);
        if (!parsed.users || !Array.isArray(parsed.slots)) return getDefaultData();
        parsed.cookiePrefs = parsed.cookiePrefs || { essential: true, personalization: true, analytics: false };
        Object.values(parsed.users).forEach(u => {
          u.phone = u.phone ?? u.radarPhone ?? '';
          u.neighborhood = u.neighborhood || 'Salamanca';
          u.security = u.security || { twoFactor: false, keepSignedIn: true };
          u.notifications = u.notifications || { whatsappUrgent: true, reminder30: true, barrioDigest: false };
          if (u.role === 'biz') {
            u.fiscalName = u.fiscalName || `${u.name} S.L.`;
            u.cif = u.cif || 'B87654321';
            u.iban = u.iban || 'ES91 2100 0418 4502 0005 1332';
          }
        });
        return parsed;
      } catch (e) {
        return getDefaultData();
      }
    }

    let DB = loadData();

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
      } catch (e) {}
    }

    /* ==========================================================================
       5. BÚSQUEDA INSENSIBLE A TILDES Y FILTROS
       ========================================================================== */
    function getFilteredLiveSlots() {
      const now = Date.now();
      const normalizedQuery = normalizeText(STATE.searchQuery);
      const queryTokens = normalizedQuery ? normalizedQuery.split(/\s+/) : [];

      let list = DB.slots.filter(s => s.st === 'live' && s.spotsLeft > 0 && s.t > now);

      if (STATE.selectedCat !== 'Todos') {
        const normCat = normalizeText(STATE.selectedCat);
        list = list.filter(s => normalizeText(s.cat) === normCat);
      }

      if (STATE.maxWalkMins < 99) {
        list = list.filter(s => (s.walkMins || 10) <= STATE.maxWalkMins);
      }

      if (queryTokens.length > 0) {
        list = list.filter(s => {
          const haystack = normalizeText([
            s.biz,
            s.s,
            s.cat,
            s.address,
            s.stylist ? s.stylist.name : '',
            s.stylist ? s.stylist.role : '',
            ...(s.tags || [])
          ].join(' '));

          return queryTokens.every(token => haystack.includes(token));
        });
      }

      if (STATE.sortBy === 'discount') {
        list.sort((a, b) => b.disc - a.disc);
      } else if (STATE.sortBy === 'price') {
        list.sort((a, b) => finalPrice(a) - finalPrice(b));
      } else if (STATE.sortBy === 'rating') {
        list.sort((a, b) => b.rating - a.rating);
      } else {
        list.sort((a, b) => a.t - b.t);
      }

      return list;
    }

    function getUserBookings() {
      if (!STATE.user) return [];
      const res = [];
      DB.slots.forEach(s => {
        (s.bookings || []).forEach((b, idx) => {
          if (b.cliId === STATE.user) {
            res.push({ slot: s, booking: b, idx });
          }
        });
      });
      return res.sort((a, b) => a.slot.t - b.slot.t);
    }

    function isFavorite(slotId) {
      if (!STATE.user || STATE.role !== 'cli') return false;
      const favs = DB.users[STATE.user].favorites || [];
      return favs.includes(slotId);
    }

    /* ==========================================================================
       9. PANTALLA DE DETALLE DEL HUECO
       ========================================================================== */
    function viewSlotDetail() {
      const s = DB.slots.find(x => x.id === STATE.detailSlotId);
      if (!s) {
        navTo('home');
        return '';
      }
      const fav = isFavorite(s.id);
      const bookingsCount = getUserBookings().length;
      const priceFinal = finalPrice(s);
      const otherLive = DB.slots.filter(x => x.id !== s.id && x.st === 'live' && x.spotsLeft > 0 && x.t > Date.now());
      const st = s.stylist || {
        name: 'Equipo del Salón',
        role: 'Especialista',
        note: 'Te esperamos en el salón a la hora reservada.',
        includes: ['Servicio completo']
      };

      let slideHtml = '';
      if (STATE.detailSlide === 0) {
        slideHtml = `
          <div style="text-align:center;">
            <div style="display:inline-flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; justify-content:center;">
              <span class="disc-pill">−${esc(s.disc)}% AHORRO</span>
              <span class="time-pill">Hoy ${esc(formatHour(s.t))} · En ${minsUntil(s.t)} min</span>
            </div>
            <div style="margin:6px auto;">${renderServiceArt(s.cat, 102)}</div>
            <div class="tabular" style="display:flex; justify-content:center; align-items:baseline; gap:8px; margin-top:4px;">
              <span style="font-size:24px; font-weight:800; color:var(--navy);">${eur(priceFinal)}</span>
              <span style="font-size:14px; color:var(--mute); text-decoration:line-through;">${eur(s.p)}</span>
            </div>
          </div>
        `;
      } else if (STATE.detailSlide === 1) {
        slideHtml = `
          <div style="width:100%;">
            <div style="font-size:12.5px; font-weight:800; color:var(--navy); margin-bottom:10px;">Qué incluye este turno:</div>
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${st.includes.map(item => `
                <div style="display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--ink-soft);">
                  ${ICONS.check}
                  <span>${esc(item)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;

        const revs = (s.reviews && s.reviews.length)

    /** Inicio de sesión unificado: detecta automáticamente si es consumidor o negocio */
    function handleUnifiedLogin(e) {
      e.preventDefault();
      const rawId = normalizeText($('auth-id').value);
      const pw = $('auth-pw').value;

      const matchedKey = Object.keys(DB.users).find(k => {
        const u = DB.users[k];
        return normalizeText(k) === rawId || (u.email && normalizeText(u.email) === rawId);
      });

      if (matchedKey && DB.users[matchedKey].pw === pw) {
        const account = DB.users[matchedKey];
        STATE.user = matchedKey;
        STATE.role = account.role;
        STATE.authError = '';
        toast(`Hola, ${account.name.split(' ')[0]}`);
        navTo(account.role === 'biz' ? 'biz_dash' : 'home');
      } else {
        STATE.authError = 'Usuario o contraseña incorrectos. Prueba iker, laura, marea o aura (contraseña 123).';
        render();
      }
    }

    function quickLogin(userKey) {
      const account = DB.users[userKey];
      if (!account) return;
      STATE.user = userKey;
      STATE.role = account.role;
      STATE.authError = '';
      toast(`Sesión iniciada como ${account.name}`);
      navTo(account.role === 'biz' ? 'biz_dash' : 'home');
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = $('reg-name').value.trim();
      const rawUser = normalizeText($('reg-user').value).replace(/[^a-z0-9@._-]/g, '');
      const pw = $('reg-pass').value;

      if (!name || !rawUser || pw.length < 3) {
        STATE.authError = 'Introduce tu nombre, usuario y una contraseña de al menos 3 caracteres.';
        render();
        return;
      }
      if (DB.users[rawUser]) {
        STATE.authError = 'Ese usuario ya está registrado. Inicia sesión directamente.';
        render();
        return;
      }

      DB.users[rawUser] = {
        pw,
        role: 'cli',
        name,
        email: rawUser.includes('@') ? rawUser : `${rawUser}@gappy.es`,
        phone: '',
        neighborhood: 'Salamanca',
        cards: [],
        favorites: [201],
        radarPhone: '',
        radarCats: ['Peluquería', 'Estética'],
        security: { twoFactor: false, keepSignedIn: true },
        notifications: { whatsappUrgent: true, reminder30: true, barrioDigest: false }
      };
      saveData();

      STATE.user = rawUser;
      STATE.role = 'cli';
      STATE.authError = '';
      toast(`Bienvenido/a a Gappy, ${name.split(' ')[0]}`);
      navTo('home');
    }

    function formatCardNum(inp) {
      const digits = inp.value.replace(/\D/g, '').slice(0, 16);
      inp.value = digits.replace(/(.{4})/g, '$1 ').trim();
    }

    function formatCardExp(inp) {
      const digits = inp.value.replace(/\D/g, '').slice(0, 4);
      inp.value = digits.length > 2 ? `${digits.slice(0, 2)}/${digits.slice(2)}` : digits;
    }

    function handleCardSubmit(e) {
      e.preventDefault();
      const digits = $('card-num').value.replace(/\D/g, '');
      if (digits.length < 13) {
        toast('Introduce un número de tarjeta válido');
        return;
      }
      const masked = `•••• ${digits.slice(-4)}`;
      const u = DB.users[STATE.user];
      if (!u.cards.includes(masked)) {
        u.cards.unshift(masked);
        saveData();
      }
      if (STATE.cardReturnView === 'checkout') {
        completeBooking(`Tarjeta ${masked}`);
      } else {
        toast('Tarjeta guardada');
        navTo(STATE.cardReturnView);
      }
    }

    function completeBooking(method) {
      const s = DB.slots.find(x => x.id === STATE.detailSlotId);
      if (!s || s.st !== 'live' || s.spotsLeft < 1) {
        toast('Este hueco acaba de ocuparse');
        navTo('home');
        return;
      }

      const u = DB.users[STATE.user];
      const total = finalPrice(s);
      const pin = String(Math.floor(1000 + Math.random() * 9000));

      s.spotsLeft -= 1;
      if (s.spotsLeft <= 0) {
        s.spotsLeft = 0;
        s.st = 'booked';
      }
      s.bookings = s.bookings || [];
      s.bookings.push({
        cliId: STATE.user,
        cliName: u.name,
        qty: 1,
        pin,
        method,
        total
      });

      STATE.lastConfirmation = {
        service: s.s,
        biz: s.biz,
        address: s.address,
        time: s.t,
        pin,
        method,
        total
      };

      saveData();
      navTo('success');
    }

    function releaseUserBooking(slotId, bookingIdx) {
      const s = DB.slots.find(x => x.id === slotId);
      if (!s || !s.bookings || !s.bookings[bookingIdx]) return;
      const [removed] = s.bookings.splice(bookingIdx, 1);
      s.spotsLeft += removed.qty;
      s.st = 'live';
      saveData();
      toast('Turno liberado · Vuelve a estar disponible');

    }

    function saveAccountProfile(e) {
      e.preventDefault();
      const name = $('prof-name').value.trim();
      const phone = $('prof-phone').value.trim();
      const neighborhood = $('prof-hood').value;
      if (!name || !phone) return;

      const u = DB.users[STATE.user];
      u.name = name;
      u.phone = phone;
      u.neighborhood = neighborhood;

      if (STATE.role === 'cli') {
        u.radarPhone = phone;
        DB.slots.forEach(s => {
          (s.bookings || []).forEach(b => {
            if (b.cliId === STATE.user) b.cliName = name;
          });
        });
      } else {
        const addrInput = $('prof-address');
        const newAddr = addrInput ? addrInput.value.trim() : u.address;
        u.address = newAddr || u.address;
        DB.slots.forEach(s => {
          if (s.bizId === STATE.user) {
            s.biz = name;
            s.address = u.address;
          }
        });
      }

      saveData();
      toast('Datos personales guardados');
      render();
    }

    function saveAccountEmail(e) {
      e.preventDefault();
      const newEmail = $('email-new').value.trim().toLowerCase();
      const confirmEmail = $('email-confirm').value.trim().toLowerCase();
      const currentPw = $('email-pw').value;
      const u = DB.users[STATE.user];

      if (!newEmail || !newEmail.includes('@')) {
        toast('Introduce un correo electrónico válido');
        return;
      }
      if (newEmail !== confirmEmail) {
        toast('Los correos electrónicos no coinciden');
        return;
      }
      if (currentPw !== u.pw) {
        toast('La contraseña actual no es correcta');
        return;
      }

      u.email = newEmail;
      saveData();
      toast('Correo electrónico actualizado');
      render();
    }

    function updatePasswordStrength(val) {
      const meter = $('pw-strength-meter');
      const label = $('pw-strength-label');
      if (!meter || !label) return;

      let score = 0;
      if (val.length >= 4) score++;
      if (val.length >= 7) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score++;

      const colors = ['#E5531E', '#F5A623', '#00A88D', '#06183D'];
      const texts = [
        'Seguridad: demasiado corta',
        'Seguridad: aceptable',
        'Seguridad: buena',
        'Seguridad: muy alta'
      ];

      const segs = meter.querySelectorAll('.strength-seg');
      segs.forEach((seg, idx) => {
        seg.style.backgroundColor = idx < score ? colors[score - 1] : 'rgba(6, 24, 61, 0.1)';
      });
      label.textContent = val.length === 0 ? 'Seguridad: pendiente de escribir' : texts[Math.max(0, score - 1)];
    }

    function saveAccountSecurity(e) {
      e.preventDefault();
      const oldPw = $('sec-old').value;
      const newPw = $('sec-new').value;
      const repPw = $('sec-rep').value;
      const u = DB.users[STATE.user];

      if (oldPw !== u.pw) {
        toast('La contraseña actual no coincide');
        return;
      }
      if (newPw.length < 4) {
        toast('La nueva contraseña debe tener al menos 4 caracteres');
        return;
      }
      if (newPw !== repPw) {
        toast('Las nuevas contraseñas no coinciden');
        return;
      }

      u.pw = newPw;
      saveData();
      toast('Contraseña actualizada con éxito');
      render();
    }

    function updateBizPreview() {
      const p = Number($('new-price')?.value || 0);
      const d = Number($('new-disc')?.value || 0);
      const fp = Math.round(p * (1 - d / 100));
      const box = $('biz-price-preview');
      if (box) {
        box.textContent = `Precio final Gappy: ${eur(fp)} (el cliente ahorra ${eur(Math.max(0, p - fp))})`;
      }
    }

    function createBizSlot(e) {
      e.preventDefault();
      const cat = $('new-cat').value;
      const spots = Number($('new-spots').value);
      const service = $('new-service').value.trim();
      const stylistName = $('new-stylist').value.trim();
      const inMins = Number($('new-in').value);
      const dur = Number($('new-dur').value);
      const price = Number($('new-price').value);
      const disc = Number($('new-disc').value);
      const biz = DB.users[STATE.user];

      if (!service || price <= 0) return;

      DB.slots.unshift({
        id: Date.now(),
        cat,
        s: service,
        p: price,
        d: dur,
        t: Date.now() + inMins * 60000,
        disc,
        walkMeters: biz.defaultWalkMeters || 400,
        walkMins: biz.defaultWalkMins || 5,
        rating: 4.9,
        reviewsCount: 130,
        spotsLeft: spots,
        st: 'live',
        bizId: STATE.user,
        biz: biz.name,
        address: biz.address,
        tags: [normalizeText(cat), normalizeText(service), normalizeText(biz.name)],
        stylist: {
          name: stylistName || 'Equipo del Salón',
          role: 'Especialista',
          note: 'Acabamos de abrir este hueco de última hora. Te esperamos con atención personalizada.',
          includes: ['Diagnóstico personalizado', 'Productos profesionales incluidos', 'Acabado de salón']
        },
        reviews: [
          { author: 'Cliente verificado', rating: 5, text: 'Atención rápida y puntual.' }
        ],
        bookings: []
      });

      saveData();
      toast('Hueco publicado en Gappy');
      navTo('biz_dash');
    }

    function removeBizSlot(slotId) {
      DB.slots = DB.slots.filter(s => s.id !== slotId);
      saveData();
      toast('Turno retirado del escaparate');
      render();
    }

    function saveBizProfile(e) {
      e.preventDefault();
      const name = $('biz-name').value.trim();
      const addr = $('biz-addr').value.trim();
      if (!name || !addr) return;
      DB.users[STATE.user].name = name;
      DB.users[STATE.user].address = addr;
      DB.slots.forEach(s => {
        if (s.bizId === STATE.user) {
          s.biz = name;
          s.address = addr;
        }
      });
      saveData();
      toast('Perfil del negocio actualizado');
      navTo('biz_dash');
    }

    function resetDemo() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      DB = getDefaultData();
      STATE.user = null;
      STATE.role = null;
      STATE.drawerOpen = false;
      STATE.selectedCat = 'Todos';
      STATE.searchQuery = '';
      navTo('login');
      toast('Datos de demostración restaurados');
    }

    let toastTimer;
    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
    }

    setInterval(() => {
      if (STATE.view === 'home' && !STATE.filterOpen && !STATE.drawerOpen) {
        render();
      }
    }, 30000);

    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
