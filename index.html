  <style>
    :root {
      --ink: #141311;
      --paper: #F5F1E8;
      --paper-card: #FAF8F3;
      --accent: #D64527;
      --sage: #2E5A44;
      --mute: #666159;
      --line: rgba(20, 19, 17, 0.16);
      --line-strong: rgba(20, 19, 17, 0.85);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      overscroll-behavior-y: none;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--paper);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.045'/%3E%3C/svg%3E");
      color: var(--ink);
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    button, input, select {
      font: inherit;
      color: inherit;
      border: none;
      background: none;
    }

    button {
      cursor: pointer;
      transition: transform 0.18s var(--ease-out), background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .serif {
      font-family: 'Fraunces', Georgia, serif;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .italic {
      font-style: italic;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* Cabecera estilo cabecera de periódico */
    header {
      padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
      border-bottom: 1.5px solid var(--ink);
      position: sticky;
      top: 0;
      background: rgba(245, 241, 232, 0.92);
      backdrop-filter: blur(10px);
      z-index: 20;
    }

    .header-inner {
      max-width: 580px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      text-align: left;
    }

    .logo {
      font-size: 23px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.05em;
    }

    .edition {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--mute);
      border-left: 1px solid var(--line);
      padding-left: 10px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-btn {
      font-size: 13px;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 4px 2px;
    }

    .link-btn:hover {
      color: var(--accent);
    }

    /* Contenedor principal */
    main {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      padding: 28px 20px 110px;
      flex: 1;
    }

    h1 {
      font-size: clamp(32px, 8.5vw, 46px);
      font-weight: 300;
      line-height: 1.05;
      margin-bottom: 12px;
    }

    .lead {
      color: var(--mute);
      font-size: 16px;
      margin-bottom: 28px;
      max-width: 44ch;
    }

    /* Barra de pulso en directo */
    .pulse-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--paper-card);
      border: 1px solid var(--line);
      margin-bottom: 24px;
      font-size: 12px;
    }

    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

      margin-bottom: 22px;
    }
